spring.application.name=Inventario-Backend
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/InventarioSystem_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#configurar los mensajes del log
logging.pattern.console=[%thread] %-5level: %logger - %msg%n
#configurar el nivel de los logs, en este caso el INFO
logging.level.root= INFO
#cambiar el puerto
#server.port=8080
spring.main.banner-mode=off