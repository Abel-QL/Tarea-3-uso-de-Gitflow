<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px; background-color: #2b2b2d;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>

    @if (errorMessage()) {
      <div id="login-error" class="alert alert-danger" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="input-username" class="form-label">Usuario</label>
        <input
          type="text"
          id="input-username"
          name="username"
          class="form-control"
          [(ngModel)]="username"
          placeholder="Ingrese su usuario"
          required
        />
      </div>

      <div class="mb-3">
        <label for="input-password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="input-password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          required
        />
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary w-100 fw-bold">
        Ingresar
      </button>
    </form>
  </div>
</div>
