@if (authService.isLoggedIn() && router.url !== '/login') {
  <div class="container">
    <nav class="navbar lg:navbar-expand bg-1 fg-2" style="background-color: #2b2b2d">
      <div class="container-fluid">
        <a class="navbar-brand" routerLink="productos">Sistema de inventarios</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" routerLink="productos"
                   routerLinkActive="active">inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="add-productos" routerLinkActive="active">Agregar productos</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
  </div>
}
<div class="container">
  <router-outlet></router-outlet>
</div>
